# The platform's stack, locally and in production: Caddy serves the web bundle and
# proxies /api to the Go API, which is reachable only on the compose network.
# The env file passed with --env-file (.env locally, .env.vps on staging, .env.prod
# in production) supplies DB_PASSWORD and SITE_ADDRESS, and APP_ENV_FILE names the
# file the api reads, .env.prod unless set; any other env file sets it to its own name.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaming
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the env file}
      POSTGRES_DB: gaming_platform
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    volumes:
      - proofs:/storage/private/deposit-proofs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in the env file}
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  proofs:
  caddy_data:
  caddy_config:
