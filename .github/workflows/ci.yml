name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gaming_platform_test
          POSTGRES_USER: gaming
          POSTGRES_PASSWORD: gaming
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaming -d gaming_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://gaming:gaming@localhost:5432/gaming_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://gaming:gaming@localhost:5432/gaming_platform_test?sslmode=disable
      REQUIRE_TEST_DATABASE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned migration tool
        run: make tools

      - name: Apply migrations
        run: make migrate-up

      - name: Lint and type-check
        run: make lint

      - name: Test with PostgreSQL required
        run: make test

      - name: Build
        run: make build

      - name: Verify reversible migrations
        run: make migrate-down-all
