  frame() {
    if (this.composer && (this.props.bloom ?? true)) this.composer.render();
    else this.renderer.render(this.scene, this.cam);
  }

  paintLabel(cup, m, fs) {
    const g = cup.ctx, w = g.canvas.width, h = g.canvas.height;
    g.clearRect(0, 0, w, h);
    g.font = LABEL_F(fs); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const cap = g.measureText('0').actualBoundingBoxAscent;

    g.fillStyle = cup.c.ink;
    g.fillText(m + 'x', w / 2, h * 0.47 + cap / 2);
    cup.tx.needsUpdate = true;
  }

  applyLabels() {
    if (!this.cups) return;
    const m = MULTS[this.state.risk], g = this.cups[0].ctx, w = g.canvas.width;
    let fs = Math.round(w * 0.46);
    const widest = () => { g.font = LABEL_F(fs); return Math.max(...m.map(v => g.measureText(v + 'x').width)); };
    while (widest() > w * 0.8 && fs > 30) fs -= 2;
    this.cups.forEach((c, i) => this.paintLabel(c, m[i], fs));
  }

  fit() {

    const w = sr.width, h = sr.height; if (!w || !h) return;
    this.W = W; this.H = H; this.off = { x: sr.left - hr.left, y: sr.top - hr.top };
    this.renderer.setSize(W, H, false);
    if (this.composer) { this.composer.setPixelRatio(this.renderer.getPixelRatio()); this.composer.setSize(W, H); }

    const T = this.T, cam = this.cam, V = T.Vector3, up = this.upper;

      up.localToWorld(new V(-WT, TOP, FACE)), up.localToWorld(new V(WT, TOP, FACE)),
      up.localToWorld(new V(0, this.isTube() ? TOP + 3.7 : TOP + 0.45, FACE)),
      new V(-WF, 0, ZB), new V(WF, 0, ZB), new V(-sideX(1.3, ZF), 1.3, ZF), new V(sideX(1.3, ZF), 1.3, ZF)

      tgt.y += (y0 + y1) / 2 * d * th * 0.9;
      d *= Math.max((x1 - x0) / 1.9, (y1 - y0) / 1.92);

  tick(now, dt) {
    for (const k in this.pegs) {
      const p = this.pegs[k];
      if (p.t > 0) { p.t = Math.max(0, p.t - dt * 3.2); p.glow.material.opacity = p.t; }
    }
    this.cups.forEach((c, i) => {
      if (c.pulse > 0) {
        c.pulse = Math.max(0, c.pulse - dt * 1.8);
        const e = c.pulse;
        c.u.forEach(u => { u.pulse.value = e; }); c.back.opacity = BACK_OP + e * 0.4; c.halo.opacity = HALO_OP + e * 0.25; c.hot.opacity = HOT_OP + e * 0.4; this.pulseU.value[i] = e; c.spark.scale.setScalar(0.22 + e * 0.4);
      }

      if (t >= 1) this.notchT = null;

  stepBall(b, now) {
    let s = b.segs[b.i], t = (now - b.st) / s.dur;

      b.i++; b.st += s.dur;
      if (b.i >= b.segs.length) { this.scene.remove(b.mesh); this.land(b); return false; }
      s = b.segs[b.i]; t = (now - b.st) / s.dur;
    }
    t = Math.max(0, t);
    let x, y, z;
    if (s.type === 'fall') {
      x = s.x0; y = s.y0 + (s.y1 - s.y0) * t * t; z = s.z0 + (s.z1 - s.z0) * Math.min(1, t * 1.6);

  }

  hitPeg(k) {
    const p = this.pegs[k]; if (p) p.t = 1;
    this.tone(1300 + Math.random() * 600, 0.05, 0.03, 'triangle');
  }

  tone(freq, dur, vol, type) {
